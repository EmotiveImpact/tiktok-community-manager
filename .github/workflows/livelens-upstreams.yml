name: LiveLens source inventory
on:
  push:
    paths:
      - '.gitmodules'
      - 'research/upstream/**'
      - 'research/upstream-lock.json'
      - 'scripts/research/verify-upstreams.mjs'
      - 'integrations/alfred/**'
      - '.github/workflows/livelens-upstreams.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'research/upstream/**'
      - 'research/upstream-lock.json'
      - 'scripts/research/verify-upstreams.mjs'
      - 'integrations/alfred/**'
      - '.github/workflows/livelens-upstreams.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/research/verify-upstreams.mjs
      - name: Baseline ALFRED manifest format
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("integrations/alfred/manifest.v1.json").read_text())
          assert d["contract_version"] == 1
          assert d["product"]["id"] == "livelens" and d["product"]["independent"]
          assert d["mode"] == "live"
          assert 60 <= d["freshness_seconds"] <= 604800
          assert all(c["kind"] == "read" and c["effect"] == "none" and c["approval"] == "not_required" for c in d["capabilities"])
          print("ALFRED manifest shape checked; full cross-repo integration untested")
          PY
