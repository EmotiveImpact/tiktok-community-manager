name: LiveLens branch checks

on:
  push:
    branches:
      - 'feat/livelens-*'
  pull_request:
    paths:
      - 'src/lib/livelens/**'
      - 'src/components/LiveLensPanel.tsx'
      - 'src/pages/LiveLensConsole.tsx'
      - 'src/pages/livelens.css'
      - 'src/main.tsx'
      - 'electron/**'
      - 'src/App.tsx'
      - 'src/state/ui.ts'
      - 'test/livelens.test.ts'
      - 'services/intelligence/**'
      - 'integrations/alfred/**'
      - 'scripts/research/**'
      - 'research/upstream-lock.json'
      - '.gitmodules'
      - '.github/workflows/livelens.yml'

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Application regression tests
        run: npm test
      - name: Type-check and bundle
        run: npm run build
  intelligence-and-source-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed source pins without executing upstream code
        run: node scripts/research/verify-upstreams.mjs
      - name: Install verified distro FFmpeg for fixture recording
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Durable service and real HTTP client checks
        run: npm --prefix services/intelligence test
      - name: Restart and evidence export demonstration
        run: npm --prefix services/intelligence run demo
      - name: Actual recording, abrupt interruption, restart and replay
        run: npm --prefix services/intelligence run demo:recording
